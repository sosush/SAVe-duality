<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAVe-Duality — Dashboard</title>
    <style>
        /* ── Reset & Base ─────────────────────────────────── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f1117;
            --surface: #181a20;
            --border: #23262f;
            --text: #e0e0e6;
            --text-muted: #7a7d8a;
            --accent: #4ade80;
            --accent-dim: #166534;
            --warn: #facc15;
            --warn-dim: #713f12;
            --danger: #f87171;
            --danger-dim: #7f1d1d;
            --radius: 8px;
        }

        html {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
        }

        /* ── Header ───────────────────────────────────────── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }

        .status-dot.warn {
            background: var(--warn);
        }

        .status-dot.danger {
            background: var(--danger);
        }

        header h1 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .header-tags {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .tag {
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            color: var(--text-muted);
            background: var(--bg);
        }

        .tag.active {
            border-color: var(--accent-dim);
            color: var(--accent);
            background: rgba(74, 222, 128, 0.06);
        }

        .tag.warn {
            border-color: var(--warn-dim);
            color: var(--warn);
            background: rgba(250, 204, 21, 0.06);
        }

        /* ── Layout ───────────────────────────────────────── */
        .grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            padding: 20px 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ── Cards ────────────────────────────────────────── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
        }

        .card-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        /* ── Video ────────────────────────────────────────── */
        .video-card {
            padding: 10px;
        }

        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 6px 10px;
        }

        .video-header .label {
            font-size: 12px;
            color: var(--text-muted);
        }

        #incident-badge {
            font-size: 12px;
            font-weight: 500;
            color: var(--accent);
        }

        .video-card img {
            width: 100%;
            height: 420px;
            object-fit: cover;
            border-radius: 6px;
            background: #000;
            display: block;
        }

        .video-card.alarm {
            border-color: var(--danger);
            box-shadow: 0 0 20px rgba(248, 113, 113, 0.15);
        }

        /* ── Sidebar ──────────────────────────────────────── */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ── Enrollment ───────────────────────────────────── */
        .enroll-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            outline: none;
            margin-bottom: 10px;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        button {
            font-size: 12px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s;
        }

        button:active {
            opacity: 0.85;
        }

        .btn-primary {
            flex: 1;
            background: var(--accent-dim);
            color: var(--accent);
        }

        .btn-primary:hover {
            background: #1a7a3e;
        }

        .btn-primary.scanning {
            background: var(--warn-dim);
            color: var(--warn);
        }

        .btn-secondary {
            background: var(--bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--danger-dim);
            color: var(--danger);
        }

        .enrolled-info {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
        }

        .enrolled-info span {
            color: var(--accent);
        }

        /* ── Gauges ───────────────────────────────────────── */
        .gauge-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .gauge {
            text-align: center;
            padding: 14px 10px;
        }

        .gauge .value {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.1;
        }

        .gauge .value.audio {
            color: #60a5fa;
        }

        .gauge .value.motion {
            color: var(--warn);
        }

        .gauge .sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ── Log Table ────────────────────────────────────── */
        .log-scroll {
            max-height: 160px;
            overflow-y: auto;
        }

        .log-scroll::-webkit-scrollbar {
            width: 4px;
        }

        .log-scroll::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }

        thead th {
            text-align: left;
            font-weight: 500;
            color: var(--text-muted);
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
        }

        tbody td {
            padding: 5px 0;
            color: var(--text-muted);
        }

        /* ── Responsive ───────────────────────────────────── */
        @media (max-width: 860px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header>
        <div class="header-left">
            <div id="status-indicator" class="status-dot"></div>
            <h1>SAVe-Duality</h1>
        </div>
        <div class="header-tags">
            <span class="tag">Kafka</span>
            <span class="tag">Iceberg</span>
            <span id="active-user-badge" class="tag">No owner enrolled</span>
        </div>
    </header>

    <div class="grid">
        <!-- Video Feed -->
        <div>
            <div id="video-box" class="card video-card">
                <div class="video-header">
                    <span class="label">Live feed</span>
                    <span id="incident-badge">Secure</span>
                </div>
                <img src="/video_feed" alt="Camera feed">
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Enrollment -->
            <div class="card">
                <div class="card-label">Face enrollment</div>
                <div class="enroll-desc">Capture face profile for owner recognition.</div>

                <input type="text" id="owner-name-input" placeholder="Owner name">

                <div class="btn-row">
                    <button id="enroll-btn" class="btn-primary" onclick="enrollCurrentFace()">Enrol</button>
                    <button class="btn-secondary" onclick="clearAllOwners()">Clear</button>
                </div>

                <div class="enrolled-info">
                    Enrolled: <span id="enrolled-names">None</span>
                </div>
            </div>

            <!-- Gauges -->
            <div class="gauge-row">
                <div class="card gauge">
                    <div class="card-label">Audio</div>
                    <div id="audio-val" class="value audio">0.0</div>
                    <div class="sub">Alert &gt; 12.0</div>
                </div>
                <div class="card gauge">
                    <div class="card-label">Motion</div>
                    <div id="motion-val" class="value motion">0.0</div>
                    <div class="sub">Alert &gt; 5.0</div>
                </div>
            </div>

            <!-- Incident Log -->
            <div class="card">
                <div class="card-label">Incident log</div>
                <div class="log-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Event</th>
                            </tr>
                        </thead>
                        <tbody id="audit-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Telemetry -->
    <script>
        let registeredOwners = [];

        async function enrollCurrentFace() {
            const input = document.getElementById('owner-name-input');
            const btn = document.getElementById('enroll-btn');
            const name = input.value.trim();
            if (!name) { alert('Enter a name first.'); return; }

            btn.disabled = true;
            btn.textContent = 'Scanning…';
            btn.classList.add('scanning');

            try {
                const res = await fetch('/api/enroll_owner', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    if (!registeredOwners.includes(name)) registeredOwners.push(name);
                    document.getElementById('enrolled-names').textContent = registeredOwners.join(', ');
                    input.value = '';
                    alert(`Profile saved for ${name} (${data.frames_scanned} frames).`);
                } else {
                    alert(data.message);
                }
            } catch {
                alert('Enrollment failed. Ensure face is visible.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enrol';
                btn.classList.remove('scanning');
            }
        }

        async function clearAllOwners() {
            await fetch('/api/clear_owners', { method: 'POST' });
            registeredOwners = [];
            document.getElementById('enrolled-names').textContent = 'None';
        }

        // Status polling
        setInterval(async () => {
            try {
                const res = await fetch('/api/telemetry');
                const d = await res.json();

                document.getElementById('audio-val').textContent = d.audio_level;
                document.getElementById('motion-val').textContent = d.motion_level || d.desk_assets || 0;
                document.getElementById('incident-badge').textContent = d.incident_tag;

                const dot = document.getElementById('status-indicator');
                const box = document.getElementById('video-box');
                const badge = document.getElementById('incident-badge');
                const userBadge = document.getElementById('active-user-badge');

                // Owner badge
                if (d.owner_name !== 'None') {
                    userBadge.textContent = d.owner_name;
                    userBadge.className = 'tag active';
                } else if (d.person_present) {
                    userBadge.textContent = 'Visitor detected';
                    userBadge.className = 'tag warn';
                } else {
                    userBadge.textContent = 'No presence';
                    userBadge.className = 'tag';
                }

                // Status colour
                if (d.status === 'TAMPER_DETECTED') {
                    box.classList.add('alarm');
                    badge.style.color = 'var(--danger)';
                    dot.className = 'status-dot danger';
                } else if (d.status === 'VISITOR_NOTICE') {
                    box.classList.remove('alarm');
                    badge.style.color = 'var(--warn)';
                    dot.className = 'status-dot warn';
                } else {
                    box.classList.remove('alarm');
                    badge.style.color = 'var(--accent)';
                    dot.className = 'status-dot';
                }
            } catch (e) { console.error(e); }
        }, 350);

        // Log polling
        setInterval(async () => {
            try {
                const res = await fetch('/api/iceberg_logs');
                const rows = await res.json();
                const tbody = document.getElementById('audit-table-body');
                tbody.innerHTML = '';
                rows.forEach(r => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${r.timestamp}</td><td>${r.incident.slice(0, 40)}</td>`;
                    tbody.appendChild(tr);
                });
            } catch (e) { console.error(e); }
        }, 2000);
    </script>
</body>

</html>
